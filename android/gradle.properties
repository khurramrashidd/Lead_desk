org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# --- Fix for "Could not close incremental caches" / "Daemon compilation failed" ---
# The Flutter pub cache lives on C: while this project is on F:. Kotlin's incremental
# compiler cannot build a relative path across two Windows drives, so it crashes while
# compiling plugins (firebase_core, google_sign_in_android, record_android).
# Turning incremental Kotlin compilation off avoids it. Builds are a little slower.
kotlin.incremental=false
